<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kuh-Evo">
<meta name="theme-color" content="#ff5fa2">

<link rel="icon" href="icon-512.png">

<title>Kuh-Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(18,28,24,.38);--glassB:rgba(255,255,255,.22);--ink:#1d2a22;--muted:#6b7a70}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',system-ui,-apple-system,sans-serif;background:#ec9cc1;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;max-width:720px;margin:0 auto;overflow:hidden;background:#fbf3f7}
#field{position:absolute;left:0;right:0;top:0;bottom:calc(98px + env(safe-area-inset-bottom));border-radius:0 0 26px 26px;overflow:hidden;box-shadow:0 6px 18px rgba(80,30,60,.12)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--glass);border:1px solid var(--glassB);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);color:#fff;font-weight:900;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.pill .coin{width:28px;height:28px}
.pill .dia{width:17px;height:17px;margin:0 6px 0 8px}
.stat{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;height:auto;padding:6px 14px;border-radius:18px;font-size:15px;line-height:1.2}
.stat small{font-size:12px;opacity:.8;font-weight:700;margin-left:3px}
.stat .cap{font-size:12px;opacity:.85;font-weight:700}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffcf2e 50%,#e09b00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.35)}
.dia{display:inline-block;width:15px;height:15px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#e6fdff,#5fe0ff 50%,#2a8cf0);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
#coins.bump{animation:bump .25s ease-out}
#crateBar{position:absolute;z-index:2;left:calc(18px + env(safe-area-inset-left));width:110px;top:calc(58px + env(safe-area-inset-top));height:6px;background:rgba(0,0,0,.22);border-radius:6px;overflow:hidden;pointer-events:none}
#crateFill{height:100%;width:0;background:linear-gradient(90deg,#fff,#ffe9a8);border-radius:6px}
#hint{position:absolute;z-index:2;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--glass);border:1px solid var(--glassB);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:800;pointer-events:none;white-space:nowrap;transition:opacity .5s}
#bar{position:absolute;z-index:2;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;padding:7px;border-radius:28px;background:#fff;border:1px solid #f3e1ea;box-shadow:0 6px 20px rgba(120,40,80,.10)}
#bar button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:21px;padding:9px 8px;font:800 14px 'Nunito',system-ui,sans-serif;color:var(--ink);background:transparent;cursor:pointer;line-height:1.15;transition:transform .12s}
#bar button span{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
#bar button small{font-size:11.5px;font-weight:700;color:var(--muted)}
#bar button svg{width:24px;height:24px;flex:none}
#bar button:not(.primary) svg{color:#ff5fa2}
#bar button small svg.ic{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
#bar button.primary{background:linear-gradient(135deg,#ffa8d2,#ff5fa2);color:#fff;box-shadow:0 6px 16px rgba(255,95,162,.4),inset 0 1px 0 rgba(255,255,255,.5)}
#bar button.primary small{color:rgba(255,255,255,.85)}
#bar button:not(.primary){flex-direction:column;gap:2px}
#bar button:not(.primary) span{align-items:center;text-align:center}
#bar button:active{transform:scale(.95)}
#bar button:disabled{opacity:.55}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.on{display:flex;animation:fade .2s ease-out}
.overlay.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.panel{position:relative;background:#fff;border-radius:28px 28px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:84vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .3s cubic-bezier(.2,.9,.3,1.15)}
.panel::before{content:'';display:block;width:40px;height:5px;border-radius:5px;background:#dfe3e0;margin:0 auto 14px}
.overlay.center .panel{border-radius:28px;padding:22px}
.overlay.center .panel::before{display:none}
.panel h2{font-size:22px;font-weight:900;margin-bottom:12px;color:var(--ink);letter-spacing:-.2px}
.panel h2.sec{margin:20px 0 10px;font-size:13px;color:#2a8cf0;text-transform:uppercase;letter-spacing:.8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:#f3f6f2;margin-bottom:8px}
.row .txt{flex:1;min-width:0}
.row b{display:block;color:var(--ink);font-weight:800;font-size:15px}
.row span{font-size:12.5px;color:var(--muted);font-weight:600}
.row button{border:0;border-radius:999px;padding:9px 14px;font:800 14px 'Nunito',system-ui,sans-serif;background:linear-gradient(135deg,#ffa8d2,#ff5fa2);color:#fff;cursor:pointer;min-width:86px;box-shadow:0 3px 8px rgba(255,95,162,.3)}
.row button.d{background:linear-gradient(135deg,#7ae6ff,#2a8cf0);color:#fff;box-shadow:0 3px 8px rgba(42,140,240,.3)}
.row button:disabled{opacity:.4;box-shadow:none}
.close{position:sticky;bottom:0;z-index:3;box-shadow:0 -14px 18px 6px rgba(255,255,255,.95);margin-top:10px;width:100%;border:0;border-radius:18px;padding:14px;font:800 16px 'Nunito',system-ui,sans-serif;background:#ff5fa2;color:#fff;cursor:pointer}
.row canvas{position:static;width:64px;height:52px;flex:none}
#discover .panel{text-align:center}
#discover canvas{position:static;width:200px;height:160px;margin:4px auto 8px}
#discover p,#offTxt,#buyNote{color:var(--muted);font-weight:600}
#discover p{margin-bottom:10px}
.ic{display:inline-block;vertical-align:-2px;margin-right:5px;flex:none}
svg.ic.coin,svg.ic.dia{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.pi{display:flex}.pi svg{width:28px;height:28px;margin:0}svg.coin,svg.dia{transform:none;background:none;box-shadow:none;border-radius:0}
#coinIcon svg{width:28px;height:28px;margin:0}#diaIcon svg{width:22px;height:22px;margin:0 2px 0 6px}
svg.ic.bolt{width:13px;height:13px;margin:0 2px 0 0;color:#ffe066}
.row button svg.ic{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
#magBtn,#crateBtn,#wkBtn{position:absolute;z-index:2;left:calc(12px + env(safe-area-inset-left));top:calc(74px + env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;border:1px solid var(--glassB);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(0,0,0,.15);cursor:pointer;padding:0;transition:transform .12s}
#magBtn:active,#crateBtn:active,#wkBtn:active{transform:scale(.92)}
#magBtn .ring,#crateBtn .ring,#wkBtn .ring{position:absolute;inset:3px;width:46px;height:46px}
#magBtn .mg,#crateBtn .mg,#wkBtn .mg{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}
#magBtn span,#crateBtn span,#wkBtn span{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#fff;color:#d6347f;font:900 10px Nunito,system-ui;padding:2px 6px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
#magBtn.off .mg,#crateBtn.off .mg{filter:grayscale(1);opacity:.55}
#magBtn.off span,#crateBtn.off span{color:#7a8580}
.sellbtn{width:100%;border:0;border-radius:18px;padding:14px;font:800 16px Nunito,system-ui;background:linear-gradient(135deg,#7ae6ff,#2a8cf0);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 16px rgba(42,140,240,.35)}
.sellbtn svg.ic{width:20px;height:20px;margin:0 0 0 4px}
.sellbtn:disabled{background:#e5e9e6;color:#7a8580;box-shadow:none}
#crateBtn{top:calc(146px + env(safe-area-inset-top))}
#goldChip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#ffe27a,#ffbf1f);color:#6b4a00;font:900 10px Nunito,system-ui;font-style:normal;padding:2px 6px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18);border:1.5px solid #fff}
#wkBtn{top:calc(218px + env(safe-area-inset-top));display:none}
#wkBtn.show{display:block}
#wkBtn.here span{background:#59d62a;color:#fff}
#wkBtn .mg{width:28px;height:28px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:40;background:#1d2a22;color:#fff;font:800 14px Nunito,system-ui;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{animation:toast 2.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
#mapBtn.new{position:relative}#mapBtn.new::after{content:'';position:absolute;top:6px;right:16px;width:10px;height:10px;border-radius:50%;background:#7dff4a;box-shadow:0 0 0 2px #fff}
.view{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#bfe6ff,#e9d9ff);max-width:720px;margin:0 auto;animation:fade .25s ease-out}
.view.on{display:flex}
.vhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px}
.vhead h2{font:900 20px Nunito,system-ui;color:var(--ink)}
.vback{justify-self:start;border:0;border-radius:999px;padding:8px 14px;font:800 14px Nunito,system-ui;background:rgba(255,255,255,.75);color:var(--ink);cursor:pointer}
#mapWrap{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:100/140;max-height:calc(100% - 110px)}
#mapPins .pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:0}
#mapPins .pin span{font:800 11.5px Nunito,system-ui;color:var(--ink);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px;white-space:nowrap}
#mapPins .pin canvas{position:static;width:64px;height:52px}
#mapPins .pin svg{width:46px;height:46px}
#mapPins .plant{position:absolute}
#mapPins .plant .lock{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:rgba(30,30,50,.6);display:flex;align-items:center;justify-content:center}
#mapPins .plant .lock svg{width:15px;height:15px}
#mapPins .plant.lk>svg{filter:grayscale(1);opacity:.7}
#mapPins .city svg{width:30px;height:30px}
#mapPins .city.on svg{filter:drop-shadow(0 0 6px #ffe066)}
#mapPins .city:not(.on) span{opacity:.75}
#mapInfo{text-align:center;color:var(--ink);font:700 14px Nunito,system-ui;margin-top:10px}
.view.dark{background:linear-gradient(#211d42,#2f2757)}
.view.dark .vhead h2{color:#fff}.view.dark .vback{background:rgba(255,255,255,.12);color:#fff}
.ppills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.pp{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:7px 10px;color:#fff;display:flex;flex-direction:column}
.pp b{font:900 15px Nunito,system-ui;color:#b8ff8a;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp small{font:700 11px Nunito,system-ui;opacity:.7}
#plantCv{position:static;width:100%;height:300px;touch-action:none;border-radius:20px;flex:none;touch-action:manipulation}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pbtns button{border:0;border-radius:18px;padding:11px 8px;font:900 16px Nunito,system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.pbtns small{font:700 11.5px Nunito,system-ui;opacity:.8}
#milkBtn{background:linear-gradient(135deg,#c6ff8a,#59d62a);color:#173d05;box-shadow:0 6px 16px rgba(110,240,60,.35)}
#milkBtn:active,#fillBtn:active{transform:scale(.96)}
#fillBtn{background:linear-gradient(135deg,#ffa8d2,#ff5fa2);color:#fff;box-shadow:0 6px 16px rgba(255,95,162,.35)}
#fillBtn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);box-shadow:none}
.pscroll{flex:1;overflow:auto;background:#fff;border-radius:22px;padding:12px}
.pscroll h3{font:900 16px Nunito,system-ui;color:var(--ink);margin:4px 2px 8px}
.pbtns.one{grid-template-columns:1fr}
#chefCard{display:none;background:#fff;border-radius:18px;padding:10px 12px;margin-top:8px;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .3s ease-out}
#chefCard.on{display:flex}
#chefCard .ct{flex:1;min-width:0}#chefCard b{display:block;font:900 14px Nunito,system-ui;color:#1d2a22}#chefCard span{font:700 12.5px Nunito,system-ui;color:#6b7a70}
#chefCard .cb{display:flex;flex-direction:column;gap:6px}
#chefYes{border:0;border-radius:999px;padding:8px 12px;font:800 13px Nunito,system-ui;background:linear-gradient(135deg,#c6ff8a,#59d62a);color:#173d05;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap}
#chefYes svg.ic{width:15px;height:15px;margin:0}
#chefNo{border:0;border-radius:999px;padding:6px 12px;font:700 12px Nunito,system-ui;background:#eef1f4;color:#4a5160;cursor:pointer}
.pbtns.one{grid-template-columns:1fr}
#calfBuy{background:linear-gradient(135deg,#c6ff8a,#59d62a);color:#173d05;box-shadow:0 6px 16px rgba(110,240,60,.35)}
#calfBuy:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);box-shadow:none}
#calfBuy small{display:flex;align-items:center;gap:2px}
#calfBuy svg.ic{width:15px;height:15px;margin:0 3px 0 0}
#birthInfo{color:rgba(255,255,255,.75);font:700 12.5px Nunito,system-ui;text-align:center;margin:8px 0 0}
.row button.mw{background:linear-gradient(135deg,#c6ff8a,#59d62a);color:#173d05;box-shadow:0 3px 8px rgba(110,240,60,.3)}
.row button.mw svg.ic{color:#173d05;width:13px;height:13px}
.pscroll .row canvas{position:static;width:64px;height:52px;flex:none}
.mrow .bar{height:6px;border-radius:6px;background:#e3e8e4;margin-top:6px;overflow:hidden}.mrow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cff6a,#3fc41c);border-radius:6px}
.mrow.done{background:#effbe8}.mrow.done button{background:#59d62a}.mrow.lockd{opacity:.55}
.locked{filter:brightness(0) opacity(.25)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".55" stop-color="#ffc21a"/><stop offset="1" stop-color="#f29d00"/></linearGradient><linearGradient id="gD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8f8ff"/><stop offset=".5" stop-color="#4fd2ff"/><stop offset="1" stop-color="#3a6bff"/></linearGradient></defs></svg>
<div id="app">
  <div id="top">
    <div class="pills"><div class="pill" id="coins"><span class="pi" id="coinIcon"></span><span id="coinTxt">0</span></div><div class="pill" id="dias"><span class="pi" id="diaIcon"></span><span id="diaTxt">0</span></div></div>
    <div class="pill stat"><div><b id="rateTxt">0</b><small>/ Sek.</small></div><div class="cap" id="capTxt">0/10 Kühe</div></div>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <button id="magBtn" class="fab" aria-label="Magnet an/aus"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3.5"/><circle id="magRing" cx="22" cy="22" r="19" fill="none" stroke="#ff5fa2" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><svg class="mg" viewBox="0 -1.5 24 24"><path d="M5 3h5v8a2 2 0 0 0 4 0V3h5v8a7 7 0 0 1-14 0z" fill="#ff5fa2"/><path d="M5 3h5v3.6H5zM14 3h5v3.6h-5z" fill="#eef1f4"/></svg><span id="magLbl">10s</span></button>
    <button id="wkBtn" aria-label="Nächster Mitarbeiter"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3.5"/><circle id="wkRing" cx="22" cy="22" r="19" fill="none" stroke="#7dff4a" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><svg class="mg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#ffd23f" stroke="#7a5a00" stroke-width="1.2"/><ellipse cx="12.3" cy="11.3" rx="6.4" ry="5.2" fill="#bfe9ff" stroke="#2a2d36" stroke-width="1.2"/><ellipse cx="12.3" cy="12" rx="4.6" ry="3.8" fill="#ffd9c2"/><circle cx="10.6" cy="11.4" r=".9" fill="#2a2d36"/><circle cx="14.2" cy="11.4" r=".9" fill="#2a2d36"/><path d="M11 13.3q1.3 1.1 2.6 0" stroke="#2a2d36" stroke-width=".8" fill="none" stroke-linecap="round"/><circle cx="12.3" cy="18.4" r="2" fill="#8a93a5" stroke="#4a5160" stroke-width=".7"/></svg><span id="wkLbl">2m</span></button>
    <button id="crateBtn" class="fab" aria-label="Kisten an/aus"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3.5"/><circle id="crateRing" cx="22" cy="22" r="19" fill="none" stroke="#ff5fa2" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><svg class="mg" viewBox="0 0 24 24"><rect x="4.5" y="9.5" width="15" height="10.5" rx="2.4" fill="#f6b26b"/><rect x="3.3" y="6.6" width="17.4" height="4.4" rx="1.8" fill="#ffc98a"/><rect x="10.7" y="6.6" width="2.6" height="13.4" fill="#ff5fa2"/><path d="M12 6.6C10.5 3.6 7 3.4 7 5.3c0 1.6 2.8 1.6 5 1.3zm0 0c1.5-3 5-3.2 5-1.3 0 1.6-2.8 1.6-5 1.3z" fill="#ff5fa2"/></svg><span id="crateLbl">35s</span><i id="goldChip">0/20</i></button>
    <div id="hint" style="display:none"></div>
  </div>
  <div id="bar">
    <button id="buyBtn" class="primary"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="6.5" fill="currentColor" opacity=".25"/><path d="M12 7.5v9M7.5 12h9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>Kuh kaufen<small id="buyCost">10</small></span></button>

<script>
// ---------- Daten ----------
const LV=[
 {n:'Kälbchen',d:'Klein, tapsig und schon ganz neugierig.',body:'#f3d9a4',spot:'#fff6e6',leg:'#e8c98d',ring:'#ffffff',sc:.72,hs:1.35,bw:.85,legs:'short',calf:1,spots:'small'},
 {n:'Milchkuh',d:'Der Klassiker. Muht pünktlich um sieben.',body:'#ffffff',spot:'#1d1d1d',leg:'#f2f2f2',ring:'#9e9e9e',sc:.85,horns:1,bell:1,udder:1,spots:'big'},
 {n:'Schokokuh',d:'Gerüchten zufolge gibt sie Kakao.',body:'#a0673a',spot:'#3e1f0d',leg:'#7a4a26',ring:'#8d5524',sc:.92,horns:1,choco:1},
 {n:'Muskelkuh',d:'Stemmt Heuballen zum Frühstück.',body:'#e8b06e',spot:'#b9783a',leg:'#d29a5c',ring:'#ff7043',sc:1.02,bw:1.08,bh:1.08,legs:'thick',horns:1,band:1,muscle:1},
 {n:'Rockerkuh',d:'Rockt die Weide mit Irokese und Blitz.',body:'#2f2f3a',spot:'#ff3d8b',leg:'#22222b',ring:'#ff3d8b',sc:1.0,horns:1,shades:1,mohawk:1,bolt:1,rocker:1},
 {n:'Roboterkuh',d:'Läuft mit Solarstrom und Gras-Updates.',body:'#b4c3cd',spot:'#7f909c',leg:'#5f6f7a',ring:'#29b6f6',sc:1.05,shape:'box',legs:'wheels',robot:1,antenna:1},
 {n:'Astronautenkuh',d:'Die erste Kuh, die wirklich über den Mond sprang.',body:'#f7f7f7',spot:'#1e63c4',leg:'#cfd8dc',ring:'#3949ab',sc:1.05,legs:'short',helmet:1,jetpack:1,float:1,suit:1},
 {n:'Alienkuh',d:'Kam per Ufo und blieb wegen der Wiese.',body:'#7ed957',spot:'#4fb236',leg:'#5bb53c',ring:'#76ff03',sc:1.08,legs:'none',third:1,alien:1,saucer:1,float:1,spots:'small'},
 {n:'Kristallkuh',d:'Funkelt im Sonnenlicht in allen Farben.',body:'#8be9ff',spot:'#ffffff',leg:'#7fd3f0',ring:'#00e5ff',sc:1.15,shape:'facet',legs:'prism',crystal:1,horns:1},
 {n:'Kosmische Kuh',d:'Hütet die Milchstraße. Ganz wörtlich.',body:'#4b3bb0',spot:'#ffe680',leg:'#3a2c90',ring:'#ffd600',sc:1.25,legs:'short',cosmic:1,wings:1,float:1},
 {n:'Radioaktive Kuh',d:'Leuchtet im Dunkeln und gibt Atom-Milch. Die Energiequelle der Welt.',body:'#cdf03a',spot:'#9bc21c',leg:'#5b6b2a',ring:'#7dff4a',sc:1.25,horns:1,radio:1}
];
const FACET=[1,.86,1.08,.9,1.05,.88,1.1,.92,1.02];
function hx2(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function shade(h,f){return 'rgb('+hx2(h).map(v=>Math.max(0,Math.min(255,Math.round(v*f)))).join(',')+')'}
function outl(d){return d.cosmic?'#2a1f6e':d.crystal?'#2f7fa3':shade(d.body,.5)}
function legFill(c,x,w,col){const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,shade(col,1.12));g.addColorStop(.5,col);g.addColorStop(1,shade(col,.75));return g}
function el(c,x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);c.fill()}
function rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function facetPath(c,cx,cy,rx,ry){c.beginPath();FACET.forEach((f,i)=>{const a=i/FACET.length*Math.PI*2;const px=cx+Math.cos(a)*rx*f,py=cy+Math.sin(a)*ry*f;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath()}
function crystalFill(c,s){const g=c.createLinearGradient(-s*.4,-s*.3,s*.4,s*.3);g.addColorStop(0,'#b8f6ff');g.addColorStop(.5,'#6fd8ff');g.addColorStop(1,'#b48cff');return g}

function drawCow(c,x,y,s,L,t,flip,lifted,glow,walk){
  const d=typeof L==='object'?L:LV[L-1];s*=d.sc;
  const bw=d.bw||1,bh=d.bh||1,RX=s*.42*bw,RY=s*.26*bh,OL=outl(d),LW=s*.022;
  c.save();c.translate(x,y);
  // Stufen-Farbring am Boden
  if(glow){c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3;c.setLineDash([6,5]);c.beginPath();c.ellipse(0,s*.05,s*.66,s*.55,0,0,7);c.stroke();c.setLineDash([])}
  if(lifted)c.translate(0,-s*.14);
  if(d.float)c.translate(0,-s*.2+Math.sin(t*2)*s*.04);
  if(flip)c.scale(-1,1);
  const b=walk?-Math.abs(Math.sin(t*9))*s*.035:Math.sin(t*5)*s*.015;

  // ---- Hintergrund-Elemente ----
  if(d.saucer){
    c.fillStyle='rgba(180,255,120,.18)';c.beginPath();c.moveTo(-s*.3,s*.36);c.lineTo(s*.3,s*.36);c.lineTo(s*.5,s*.75);c.lineTo(-s*.5,s*.75);c.fill();
    el(c,0,s*.32,s*.6,s*.13,'#8e9aa3');el(c,0,s*.27,s*.48,s*.08,'#cfd8dc');
    for(let i=0;i<5;i++)el(c,-s*.4+i*s*.2,s*.34,s*.03,s*.03,Math.sin(t*6+i)>0?'#ffeb3b':'#ff5252');
  }
  if(d.starburst){c.save();c.translate(0,b);c.rotate(t*.4);for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.fillStyle=i%2?'rgba(255,255,255,.35)':'rgba(255,140,220,.35)';c.beginPath();c.moveTo(0,0);c.lineTo(-s*.05,-s*.62);c.lineTo(s*.05,-s*.62);c.fill()}c.restore()}
  if(d.wings){const fl=Math.sin(t*3)*.16;c.save();c.translate(-s*.04,-s*.17+b);c.rotate(-.3+fl);c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-s*.08,-s*.34,-s*.42,-s*.4,-s*.52,-s*.22);c.quadraticCurveTo(-s*.42,-s*.17,-s*.45,-s*.1);c.quadraticCurveTo(-s*.34,-s*.08,-s*.35,-s*.02);c.quadraticCurveTo(-s*.22,-s*.02,-s*.2,s*.05);c.closePath();c.fillStyle='#ffffff';c.fill();c.strokeStyle='#b6a6f2';c.lineWidth=s*.02;c.stroke();c.restore();}
  if(d.jetpack){rr(c,-s*.42,-s*.32+b,s*.18,s*.34,s*.05,'#90a4ae');rr(c,-s*.4,-s*.28+b,s*.05,s*.26,s*.02,'#cfd8dc');
    const fl=s*(.12+Math.random()*.06);el(c,-s*.33,s*.08+b+fl*.5,s*.06,fl,'#ff9800');el(c,-s*.33,s*.06+b+fl*.35,s*.03,fl*.6,'#fff176')}

  // ---- Beine ----
  const lx=[-.3,-.14,.1,.26].map(v=>v*bw);
  if(d.legs==='wheels'){[-.22,.22].forEach(wx=>{el(c,wx*s,s*.3,s*.12,s*.12,'#37474f');el(c,wx*s,s*.3,s*.05,s*.05,'#b0bec5');c.strokeStyle='#b0bec5';c.lineWidth=s*.015;c.beginPath();const a=t*4;c.moveTo(wx*s+Math.cos(a)*s*.1,s*.3+Math.sin(a)*s*.1);c.lineTo(wx*s-Math.cos(a)*s*.1,s*.3-Math.sin(a)*s*.1);c.stroke()})}
  else if(d.legs==='prism'){lx.forEach(v=>{c.fillStyle='#7fd3f0';c.beginPath();c.moveTo(v*s,s*.08);c.lineTo(v*s+s*.12,s*.08);c.lineTo(v*s+s*.06,s*.42);c.closePath();c.fill();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.moveTo(v*s+s*.06,s*.08);c.lineTo(v*s+s*.12,s*.08);c.lineTo(v*s+s*.06,s*.42);c.fill()})}
  else if(d.legs!=='none'){
    const w=d.legs==='thick'?.16:.1,len=d.legs==='short'?.2:.32;
    lx.forEach((v,i)=>{const sw=(lifted||d.float||walk)?Math.sin(t*(d.float?3:walk?9:14)+(walk?(i%2)*Math.PI:i))*s*.03:0;const x0=v*s+sw;c.beginPath();c.roundRect(x0,s*.06,s*w,s*(len+.03),s*w*.35);c.fillStyle=d.leg;c.fill();c.strokeStyle=OL;c.lineWidth=LW;c.stroke();c.beginPath();c.roundRect(x0-s*.006,s*(.03+len),s*w+s*.012,s*.065,[s*.01,s*.01,s*.025,s*.025]);c.fillStyle=d.suit?'#78909c':d.cosmic?'#ffd600':'#3b2a20';c.fill();c.stroke()});
  }
  // ---- Schwanz ----
  if(!d.robot&&!d.crystal){c.lineCap='round';c.beginPath();c.moveTo(-RX*.95,-s*.05+b);c.quadraticCurveTo(-RX-s*.14,Math.sin(t*3)*s*.06,-RX-s*.08,s*.16);c.strokeStyle=OL;c.lineWidth=s*.065;c.stroke();c.strokeStyle=d.leg;c.lineWidth=s*.035;c.stroke();el(c,-RX-s*.08,s*.18,s*.04,s*.055,d.cosmic?'#ffd600':'#3b2a20');c.strokeStyle=OL;c.lineWidth=LW*.8;c.stroke()}
  if(d.robot){c.strokeStyle='#37474f';c.lineWidth=s*.025;c.beginPath();c.moveTo(-RX,-s*.05);c.bezierCurveTo(-RX-s*.15,-s*.05,-RX-s*.05,s*.15,-RX-s*.15,s*.18);c.stroke();el(c,-RX-s*.15,s*.18,s*.03,s*.03,'#ffca28')}

  // ---- Körper ----
  const bodyPath=()=>{if(d.shape==='box'){c.beginPath();c.roundRect(-RX,-RY+b,RX*2,RY*1.8,s*.08)}else if(d.shape==='facet'){facetPath(c,0,b,RX,RY*1.1)}else{c.beginPath();c.ellipse(0,b,RX,RY,0,0,7)}};
  if(d.cosmic){c.shadowColor='rgba(180,160,255,.8)';c.shadowBlur=s*.3}
  if(d.crystal){c.shadowColor='#bff4ff';c.shadowBlur=s*.35}
  if(d.radio){c.shadowColor=d.glow||'rgba(125,255,74,.95)';c.shadowBlur=s*.45}
  bodyPath();c.fillStyle=d.crystal?crystalFill(c,s):d.body;c.fill();c.shadowBlur=0;
  c.save();bodyPath();c.clip();
  if(d.spots==='big'){[[-.22,-.12,.14],[.1,.12,.12],[-.02,-.22,.08],[.24,-.1,.08]].forEach(([sx,sy,r])=>el(c,sx*s,sy*s+b,r*s*1.2,r*s*.8,d.spot,.5))}
  if(d.spots==='small'){[[-.22,-.08,.06],[.05,.1,.05],[-.05,-.16,.04],[.2,-.06,.05],[-.3,.12,.04]].forEach(([sx,sy,r])=>el(c,sx*s,sy*s+b,r*s,r*s*.8,d.spot,.4))}
  if(d.choco){c.fillStyle=d.spot;c.fillRect(-RX,-RY+b,RX*2,RY*.75);
    [[-.32,.12],[-.2,.2],[-.05,.1],[.08,.22],[.22,.14],[.32,.08]].forEach(([dx,l])=>{rr(c,dx*s-s*.035,-RY*.3+b,s*.07,l*s,s*.035,d.spot)});
    const cols=['#ff4081','#ffeb3b','#40c4ff','#69f0ae','#fff'];for(let i=0;i<14;i++){c.save();c.translate(((i*.137)%1-.5)*RX*1.6,-RY*.75+((i*.31)%1)*RY*.5+b);c.rotate(i);c.fillStyle=cols[i%5];c.fillRect(-s*.02,-s*.006,s*.04,s*.012);c.restore()}}
  if(d.stripes){c.fillStyle='#2a2a2a';c.fillRect(-RX,-s*.05+b,RX*2,s*.14);c.fillStyle='#ffd23f';for(let i=-8;i<8;i++){c.beginPath();c.moveTo(i*s*.08,-s*.05+b);c.lineTo(i*s*.08+s*.04,-s*.05+b);c.lineTo(i*s*.08-s*.02,s*.09+b);c.lineTo(i*s*.08-s*.06,s*.09+b);c.closePath();c.fill()}}
  if(d.porthole){const R=s*.12,px=-s*.04,py=b;const g=c.createRadialGradient(px,py,1,px,py,R);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#9ff4ff');g.addColorStop(1,'#1fb6ff');c.fillStyle=g;c.beginPath();c.arc(px,py,R,0,7);c.fill();c.strokeStyle='#d9e2ec';c.lineWidth=s*.03;c.stroke();c.fillStyle='rgba(255,255,255,'+(.5+.4*Math.sin(t*5))+')';c.beginPath();c.arc(px,py,R*.35,0,7);c.fill()}
  if(d.radio&&!d.noTre){const hx=-s*.06,hy=b+s*.01,R=s*.12;el(c,hx,hy,R,R,'#ffe14d');c.strokeStyle='#1d1d1d';c.lineWidth=s*.015;c.beginPath();c.arc(hx,hy,R,0,7);c.stroke();c.fillStyle='#1d1d1d';for(let i=0;i<3;i++){const a0=-Math.PI/2+i*2*Math.PI/3-Math.PI/6;c.beginPath();c.moveTo(hx,hy);c.arc(hx,hy,R*.82,a0,a0+Math.PI/3);c.closePath();c.fill()}el(c,hx,hy,R*.26,R*.26,'#ffe14d');el(c,hx,hy,R*.15,R*.15,'#1d1d1d');
    [[.22,.1,.045,0],[.3,-.06,.03,1.5],[-.3,-.1,.035,3]].forEach(([u,v,r,o])=>el(c,u*s,v*s+b,r*s,r*s*1.15,'rgba(125,255,74,'+(.6+.35*Math.sin(t*3+o))+')'))}
  if(d.bolt){c.fillStyle=d.rocker?'#ff3d8b':'#ffd600';c.beginPath();c.moveTo(-s*.02,-s*.2+b);c.lineTo(-s*.16,s*.02+b);c.lineTo(-s*.07,s*.02+b);c.lineTo(-s*.12,s*.2+b);c.lineTo(s*.06,-s*.04+b);c.lineTo(-s*.03,-s*.04+b);c.lineTo(s*.03,-s*.2+b);c.closePath();c.fill();c.strokeStyle=d.rocker?'#ffffff':'#b58f00';c.lineWidth=s*.016;c.stroke()}
  if(d.robot){c.strokeStyle=d.spot;c.lineWidth=s*.02;c.beginPath();c.moveTo(-s*.12,-RY+b);c.lineTo(-s*.12,RY+b);c.moveTo(s*.14,-RY+b);c.lineTo(s*.14,RY+b);c.stroke();
    rr(c,-s*.08,-s*.12+b,s*.18,s*.14,s*.02,'#37474f');for(let i=0;i<3;i++)el(c,-s*.04+i*s*.05,-s*.05+b,s*.015,s*.015,Math.sin(t*5+i*2)>0?'#00e676':'#1b5e20');
    c.fillStyle='#55656f';[[-.32,-.12],[-.32,.1],[.3,-.12],[.3,.1]].forEach(([a,e])=>{c.beginPath();c.arc(a*s,e*s+b,s*.02,0,7);c.fill()})}

const HZ=.2,DAY=180;
let bgC=null,bgW=0,bgH=0,clouds=[],rings=[],flyers=[];
function srand(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
function hex(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function night(){const p=(T/DAY)%1,v=(1-Math.cos(2*Math.PI*p))/2;return clamp((v-.6)/.3,0,1)}
function drawTree(g,x,y,s,r){
  g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(x,y+2,s*.5,s*.12,0,0,7);g.fill();
  g.fillStyle='#7a5230';g.fillRect(x-s*.08,y-s*.6,s*.16,s*.62);
  [['#e46aa4',0,-.85,.42],['#ee86b8',-.25,-.7,.32],['#ee86b8',.25,-.72,.32],['#f6a8cb',-.08,-1.0,.3],['#fcc8de',.1,-.95,.18]].forEach(([c,dx,dy,rr])=>{g.fillStyle=c;g.beginPath();g.arc(x+dx*s,y+dy*s,rr*s,0,7);g.fill()});
  if(r()<.5){g.fillStyle='#ffffff';for(let i=0;i<4;i++){g.beginPath();g.arc(x+(r()-.5)*s*.7,y-s*(.7+r()*.35),s*.04,0,7);g.fill()}}
}
function buildBg(){
  bgW=W;bgH=H;bgC=bgC||document.createElement('canvas');
  bgC.width=W*DPR;bgC.height=H*DPR;const g=bgC.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  const r=srand(4242),hz=H*HZ;
  // ferne Hügel
  [['#f9d3e4',-26,24,90],['#f5bdd6',-8,18,60]].forEach(([col,off,amp,wl],k)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+8;x+=6)g.lineTo(x,hz+off+Math.sin(x/wl+k*2)*amp*.5+Math.sin(x/23+k)*amp*.12);g.lineTo(W,H);g.fill()});
  // Bäume am Horizont
  const tn=Math.max(3,Math.round(W/130));for(let i=0;i<tn;i++){const x=(i+.2+r()*.6)/tn*W;drawTree(g,x,hz+2+r()*6,26+r()*16,r)}
  // Wiese
  const m=g.createLinearGradient(0,hz,0,H);m.addColorStop(0,'#f7c3da');m.addColorStop(1,'#ec9cc1');g.fillStyle=m;g.fillRect(0,hz+12,W,H);
  g.fillStyle='#f7c3da';g.fillRect(0,hz+8,W,6);
  // Licht- und Schattenflecken
  for(let i=0;i<22;i++){g.fillStyle=i%2?'rgba(255,255,255,.12)':'rgba(170,40,100,.06)';g.beginPath();g.ellipse(r()*W,hz+30+r()*(H-hz),40+r()*90,14+r()*30,0,0,7);g.fill()}
  // Zaun
  const fy=hz+16;g.fillStyle='#b98a5a';g.strokeStyle='#8a6038';g.lineWidth=1;
  g.fillRect(0,fy-14,W,4);g.fillRect(0,fy-5,W,4);
  for(let x=10;x<W;x+=38){g.fillStyle='#c99a68';g.fillRect(x-3,fy-22,7,26);g.fillStyle='#8a6038';g.fillRect(x-3,fy+2,7,2);g.beginPath();g.moveTo(x-3,fy-22);g.lineTo(x+0.5,fy-26);g.lineTo(x+4,fy-22);g.fillStyle='#c99a68';g.fill()}
  // Steine
  for(let i=0;i<5;i++){const x=r()*W,y=hz+50+r()*(H-hz-60);g.fillStyle='#9ea7a0';g.beginPath();g.ellipse(x,y,6+r()*6,4+r()*3,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(x-2,y-2,3,1.5,0,0,7);g.fill()}
  // Grasbüschel
  const gn=Math.round(W*H/2200);g.lineCap='round';
  for(let i=0;i<gn;i++){const x=r()*W,y=hz+28+r()*(H-hz-28),h=5+r()*6;g.strokeStyle=r()<.5?'rgba(205,85,145,.45)':'rgba(255,230,242,.75)';g.lineWidth=1.6;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y-h);g.moveTo(x,y);g.lineTo(x,y-h*1.2);g.moveTo(x,y);g.lineTo(x+3,y-h);g.stroke()}
  // Blumen
  const fn=Math.round(W*H/7000),fc=['#ffffff','#ffe066','#ff5fa2','#b48cff','#ffffff'];
  for(let i=0;i<fn;i++){const x=r()*W,y=hz+34+r()*(H-hz-34),c=fc[Math.floor(r()*fc.length)],s=2.2+r()*1.4;
    g.strokeStyle='#d0679b';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+6);g.stroke();
    g.fillStyle=c;for(let k=0;k<5;k++){const a=k/5*Math.PI*2;g.beginPath();g.arc(x+Math.cos(a)*s,y+Math.sin(a)*s,s*.8,0,7);g.fill()}
    g.fillStyle='#ffb300';g.beginPath();g.arc(x,y,s*.6,0,7);g.fill()}
}
function drawSky(dt){
  const hz=H*HZ,p=(T/DAY)%1,n=night();
  const g=cx.createLinearGradient(0,0,0,hz+30);
  g.addColorStop(0,mix('#4fb0f0','#2c3d86',n));g.addColorStop(1,mix('#d4f0ff','#7584c4',n));
  cx.fillStyle=g;cx.fillRect(0,0,W,hz+40);
  if(n>0){for(let i=0;i<45;i++){const x=(Math.abs(Math.sin(i*91.7)*7919)%1)*W,y=(Math.abs(Math.sin(i*37.3)*3571)%1)*hz;cx.fillStyle='rgba(255,255,255,'+(n*(.4+.6*Math.abs(Math.sin(T*1.5+i))))+')';cx.fillRect(x,y,1.6,1.6)}}
  const q=(p+.5)%1;
  if(q>.12&&q<.88){const u=(q-.12)/.76,sx=W*(.06+.88*u),sy=hz*(1.05-.8*Math.sin(Math.PI*u));
    const sg=cx.createRadialGradient(sx,sy,4,sx,sy,48);sg.addColorStop(0,'rgba(255,240,150,.9)');sg.addColorStop(1,'rgba(255,240,150,0)');cx.fillStyle=sg;cx.beginPath();cx.arc(sx,sy,48,0,7);cx.fill();
    cx.fillStyle=mix('#ffe066','#ff8a3d',Math.max(0,1-Math.sin(Math.PI*u)*2.2));cx.beginPath();cx.arc(sx,sy,16,0,7);cx.fill()}
  if(p>.28&&p<.72){const u=(p-.28)/.44,mx=W*(.06+.88*u),my=hz*(1.05-.8*Math.sin(Math.PI*u));
    const mg=cx.createRadialGradient(mx,my,8,mx,my,44);mg.addColorStop(0,'rgba(255,248,220,.45)');mg.addColorStop(1,'rgba(255,248,220,0)');cx.fillStyle=mg;cx.beginPath();cx.arc(mx,my,44,0,7);cx.fill();cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.moveTo(mx+19,my-5);cx.arc(mx+7,my-5,12,0,Math.PI*2,true);cx.closePath();cx.clip('evenodd');cx.fillStyle='#fff6d6';cx.beginPath();cx.arc(mx,my,14,0,7);cx.fill();cx.restore()}
  if(!clouds.length)for(let i=0;i<4;i++)clouds.push({x:(i+Math.random()*.6)/4*W,y:(.12+Math.random()*.4)*hz,s:.6+Math.random()*.7,v:4+Math.random()*8});
  clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+90)c.x=-90;const a=1-.3*n;cx.fillStyle='rgba(255,255,255,'+(.9*a)+')';
    [[-22,4,16],[0,-4,22],[22,3,16],[8,8,14],[-8,8,14]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(c.x+dx*c.s,c.y+dy*c.s,r*c.s,0,7);cx.fill()})});
}

  const n=diaFor(c.lvl);S.cows=S.cows.filter(o=>o!==c);S.dia+=n;

  for(let L=1;L<mergeCap();L++){const g=S.cows.filter(c=>c.lvl===L&&!(drag&&drag.c===c));if(g.length<2)continue;
    let best=null,bd=9;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const d=Math.hypot(g[i].x-g[j].x,g[i].y-g[j].y);if(d<bd){bd=d;best=[g[i],g[j]]}}

}

  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  floats.forEach(f=>{f.y-=(f.gold?22:40)*dt;f.l-=dt});floats=floats.filter(f=>f.l>0);
  if(drag){if(drag.moved&&overSell(drag.c))drag.sellT+=dt;else drag.sellT=0}
  if(S.magnetOn!==false&&!magPull){magT+=dt;if(magT>=magInt(S.up.magnet)){magT=0;startMagnet()}}
  if(magPull){const {a,b}=magPull;
    if(!S.cows.includes(a)||!S.cows.includes(b)||a.lvl!==b.lvl||(drag&&(drag.c===a||drag.c===b)))magPull=null;
    else{const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),sp=Math.max(.5,d*3.5)*dt;b.wait=Math.max(b.wait,.4);b.tx=b.x;b.ty=b.y;
      if(d<=sp+.012){magPull=null;merge(a,b)}else{a.x+=dx/d*sp;a.y+=dy/d*sp;a.tx=a.x;a.ty=a.y;a.flip=dx<0;a.mv=1}}}
  updMagUI();
  if(drag&&!drag.moved&&performance.now()-drag.t0>LP_MS){const c=drag.c;drag=null;openCowSheet(c)}
  plantTick(dt);updateWorker(dt);updateChef(dt);if(plantOpen)drawPlant(dt);
  if(S.test){if(S.coins<1e12)S.coins=1e12;if(S.dia<1e6)S.dia=1e6;if((S.atom||0)<1e4)S.atom=1e4}
  draw(dt);ui();
  requestAnimationFrame(loop);
}
function draw(dt){
  cx.clearRect(0,0,W,H);
  if(bgW!==W||bgH!==H)buildBg();
  drawSky(dt);cx.drawImage(bgC,0,0,W,H);
  drawSell();
  drawMagLine();
  if(drag&&!drag.moved){const pr=(performance.now()-drag.t0-130)/(LP_MS-130);if(pr>0){const [x,y]=toPx(drag.c),r=cowSize()*.62;cx.save();cx.lineCap='round';cx.lineWidth=5;cx.strokeStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();cx.strokeStyle='#ff5fa2';cx.beginPath();cx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.min(1,pr)*Math.PI*2);cx.stroke();cx.restore()}}
  const s=cowSize();
  crates.forEach(k=>{const [x,y]=toPx(k);const e=1-Math.pow(1-k.drop,3);drawCrate(cx,x,y-(1-e)*H*.4,s,k.gold,k.drop>=1?Math.sin(T*3.2+k.x*20)*.06:0)});
  const order=[...S.cows].sort((a,b)=>a.y-b.y);
  if(drag){const dc=drag.c;order.splice(order.indexOf(dc),1);order.push(dc)}
  order.forEach(c=>{const [x,y]=toPx(c);const sc=1+(c.pop?Math.sin(c.pop*Math.PI)*.35:0)+(c.tap?Math.sin(c.tap*Math.PI)*.06:0);
    const glow=drag&&drag.moved&&drag.c!==c&&drag.c.lvl===c.lvl&&c.lvl<mergeCap();
    drawCow(cx,x,y,s*sc,c.lvl,T+c.id,c.flip,drag&&drag.moved&&drag.c===c,glow,c.mv&&!(drag&&drag.c===c));
    if(drag&&drag.c===c&&overSell(c)){cx.globalAlpha=.35;cx.fillStyle='#4dd9ff';cx.beginPath();cx.arc(x,y,s*.55,0,7);cx.fill();cx.globalAlpha=1;const n=diaFor(c.lvl),t='+'+n;cx.font='bold 20px Nunito, system-ui';cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='rgba(0,0,0,.45)';const tw=cx.measureText(t).width;cx.strokeText(t,x-10,y-s*.75);cx.fillStyle='#fff';cx.fillText(t,x-10,y-s*.75);drawDia(cx,x+tw/2-2,y-s*.77,11)}});
  drawWorker();
  drawChefMeadow();
  drawNight();
  coins.forEach(k=>{const [x,y]=toPx(k);const a=k.age>5?6-k.age:1;drawCoin(cx,x,y-Math.min(1,k.age*3)*s*.15+Math.sin(T*4+k.x*9)*2,s*.13,a)});
  parts.forEach(p=>{cx.globalAlpha=Math.max(0,p.l*1.5);cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill()});cx.globalAlpha=1;
  drawFx(dt);
  floats.forEach(f=>{if(f.gold){drawTapBadge(f);return}cx.globalAlpha=Math.min(1,f.l*2);cx.fillStyle=f.gold?'#ffe066':'#fff';cx.strokeStyle='rgba(60,40,0,.65)';cx.lineWidth=f.gold?4:3;cx.font=f.gold?'800 20px Nunito, system-ui':'bold 16px Nunito, system-ui';cx.textAlign='center';const fw=cx.measureText(f.t).width/2+8,fx=Math.min(W-fw,Math.max(fw,f.x));cx.strokeText(f.t,fx,f.y);cx.fillText(f.t,fx,f.y)});cx.globalAlpha=1;
}
let uiT=0;
function ui(){
  uiT++;if(uiT%6)return;
  {const ct=document.getElementById('coinTxt'),v=Math.floor(S.coins).toLocaleString('de-DE');ct.textContent=v;ct.style.fontSize=v.length>13?'13px':v.length>10?'15px':''}document.getElementById('diaTxt').textContent=fmt(S.dia);
  document.getElementById('rateTxt').innerHTML=(rate()>=10?fmt(rate()):rate().toFixed(1))+(boost()>1?' '+IC.bolt+Math.ceil((S.boostUntil-Date.now())/1000)+'s':'');
  document.getElementById('capTxt').textContent=S.cows.length+'/'+cap()+' Kühe';
  const bc=buyCost();document.getElementById('buyCost').innerHTML=S.cows.length>=cap()?'Weide voll':'ab '+IC.coin+fmt(bc);
  document.getElementById('buyBtn').disabled=S.coins<bc||S.cows.length>=cap();
  document.getElementById('dexTxt').textContent=S.highest+'/'+MAXL;if(plantOpen)updPlantUI();
  if(document.getElementById('shop').classList.contains('on'))renderShop(true);if(document.getElementById('buy').classList.contains('on'))renderBuy(true);
}
document.getElementById('buyBtn').onclick=()=>{if(S.cows.length>=cap())return;renderBuy();open('buy')};
function buyLevel(L){const pr=priceOf(L);if(L>maxBuy()||S.coins<pr||S.cows.length>=cap())return;S.coins-=pr;S.buys++;const c=addCow(L);c.pop=1;burst(c.x*W,c.y*H,'#ffd84a',10);renderBuy(true);save()}
function renderBuy(update){
  const box=document.getElementById('buyList'),n=maxBuy();
  if(!update||box.children.length!==n){box.innerHTML='';for(let L=1;L<=n;L++){const r=document.createElement('div');r.className='row';r.appendChild(miniCow(L,64,52,false));
    const t=document.createElement('div');t.className='txt';t.innerHTML='<b>'+L+'. '+LV[L-1].n+'</b><span></span>';r.appendChild(t);
    const b=document.createElement('button');b.onclick=()=>buyLevel(L);r.appendChild(b);box.appendChild(r)}}
  const full=S.cows.length>=cap();
  for(let L=1;L<=n;L++){const r=box.children[L-1];r.querySelector('span').innerHTML=IC.coin+fmt(income(L))+' / '+COIN_EVERY+' s';const b=r.querySelector('button');b.innerHTML=full?'Voll':IC.coin+fmt(priceOf(L));b.disabled=full||S.coins<priceOf(L)}
  document.getElementById('buyNote').textContent=(full?'Deine Weide ist voll. ':'')+'Kaufbar sind alle entdeckten Stufen außer deiner höchsten ('+LV[S.highest-1].n+').';
}

// ---------- Panels ----------
function open(id){document.getElementById(id).classList.add('on')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('on'));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='discover')o.classList.remove('on')}));
document.getElementById('shopBtn').onclick=()=>{renderShop();open('shop')};
document.getElementById('dexBtn').onclick=()=>{renderDex();open('dex')};
function renderShop(update){
  const box=document.getElementById('shopList');
  if(!update){box.innerHTML='';UPG.forEach((u,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML='<div class="txt"><b>'+u.n+'</b><span></span></div><button></button>';r.querySelector('button').onclick=()=>buyUpg(i);box.appendChild(r)})}
  UPG.forEach((u,i)=>{const r=box.children[i],l=S.up[u.k],maxed=l>=u.max,locked=u.need&&S.highest<u.need(l);
    r.querySelector('span').textContent=maxed?'Maximal':locked?'Erst '+LV[u.need(l)-1].n+' entdecken':u.d(l)+' → '+u.d(l+1);
    const b=r.querySelector('button');b.innerHTML=maxed?'MAX':IC.coin+fmt(u.cost(l));b.disabled=maxed||locked||S.coins<u.cost(l)});
  renderDia(update);
}
const DSHOP=[
 {n:'Turbo-Gras',d:()=>'60 Sek. doppelte Einnahmen',cost:8,can:()=>true,buy:()=>{S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+60000}},
 {n:'Kistenregen',d:()=>'Bis zu 5 Geschenkboxen sofort',cost:6,can:()=>S.cows.length+crates.length<cap(),buy:()=>{const n=Math.min(5,cap()-S.cows.length-crates.length);for(let i=0;i<n;i++)setTimeout(spawnCrate,i*180)}}
];
function sack(){return Math.max(250,rate()/boost()*300)}
function gold(){return Math.max(1,S.highest-2)}
function renderDia(update){
  const box=document.getElementById('diaList');
  if(!update){box.innerHTML='';DSHOP.forEach((u,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML='<div class="txt"><b>'+u.n+'</b><span></span></div><button class="d"></button>';r.querySelector('button').onclick=()=>{if(S.dia<u.cost||!u.can())return;S.dia-=u.cost;u.buy();renderDia(true);save()};box.appendChild(r)})}
  DSHOP.forEach((u,i)=>{const r=box.children[i];r.querySelector('span').textContent=u.can()?u.d():'Weide voll';const b=r.querySelector('button');b.innerHTML=IC.dia+u.cost;b.disabled=S.dia<u.cost||!u.can()});
}
function buyUpg(i){const u=UPG[i],l=S.up[u.k];if(l>=u.max||(u.need&&S.highest<u.need(l))||S.coins<u.cost(l))return;S.coins-=u.cost(l);S.up[u.k]++;renderShop(true);save()}
function miniCow(L,w,h,locked){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.scale(2,2);drawCow(g,w*.45,h*.55,h*.75,L,1,false);if(locked)c.className='locked';return c}
function renderDex(){
  const box=document.getElementById('dexList');box.innerHTML='';
  LV.forEach((d,i)=>{const L=i+1,known=L<=S.highest;const r=document.createElement('div');r.className='row';r.appendChild(miniCow(L,64,52,!known));
    const t=document.createElement('div');t.className='txt';t.innerHTML='<b>'+(known?L+'. '+d.n:L+'. ???')+'</b><span>'+(known?d.d+'<br>'+IC.coin+fmt(income(L))+' / '+COIN_EVERY+' s · '+IC.dia+diaFor(L):'Noch nicht entdeckt')+'</span>';r.appendChild(t);box.appendChild(r)});
}
let discAnim=null;
function discover(L){
  document.getElementById('discName').textContent=LV[L-1].n;
  document.getElementById('discDesc').textContent=LV[L-1].d+(L===MAXL?' Sie zieht jetzt ins Kernkraftwerk – öffne die Weltkarte!':'');
  open('discover');
  const c=document.getElementById('discCv'),g=c.getContext('2d');let t=0;cancelAnimationFrame(discAnim);
  (function a(){t+=.016;g.clearRect(0,0,400,320);g.save();g.translate(200,170);g.rotate(t*.3);for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.fillStyle='rgba(255,216,74,.25)';g.beginPath();g.moveTo(0,0);g.lineTo(-30,-200);g.lineTo(30,-200);g.fill()}g.restore();drawCow(g,190,175,230,L,t,false);if(document.getElementById('discover').classList.contains('on'))discAnim=requestAnimationFrame(a)})();
}
let resetArm=0;
document.getElementById('resetBtn').onclick=()=>{const b=document.getElementById('resetBtn');
  if(Date.now()-resetArm<4000){try{localStorage.removeItem('kuhEvo1');localStorage.removeItem('kuhEvoTap')}catch(e){}window.__reset=1;location.reload();return}
  resetArm=Date.now();b.querySelector('span').textContent='Wirklich? Nochmal tippen';b.style.background='#ff5fa2';b.style.color='#fff';
  setTimeout(()=>{b.querySelector('span').textContent='Neu starten';b.style.background='#fde7f1';b.style.color='#d6347f'},4000)};
function hideHint(){}
hideHint();
setInterval(save,5000);
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function updTestBtn(){const b=document.getElementById('testBtn');b.textContent='Test '+(S.test?'an':'aus');b.style.background=S.test?'#1d2a22':'#eef1f4';b.style.color=S.test?'#fff':'#1d2a22';
  document.getElementById('coins').style.outline=S.test?'2px dashed #fff':'none'}
document.getElementById('testBtn').onclick=()=>{if(!S.test){S.testBackup={coins:S.coins,dia:S.dia,atom:S.atom||0};S.test=true}else{S.test=false;if(S.testBackup){S.coins=S.testBackup.coins;S.dia=S.testBackup.dia;S.atom=S.testBackup.atom||0;delete S.testBackup}}updTestBtn();save()};
updTestBtn();
initPlant();
requestAnimationFrame(loop);
</script>
</body>
